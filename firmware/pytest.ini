[pytest]
# Unicorn uses handled Windows native faults while reserving emulated RAM.
# Pytest's native fault handler reports those as fatal although execution resumes.
# The suite is CPU-bound Unicorn emulation: pytest-xdist runs it on every core
# (worksteal hands queued tests to idle workers). Pass -n 0 to run it in one process.
addopts = -p no:faulthandler -p no:cacheprovider -n auto --dist worksteal
testpaths = tests
