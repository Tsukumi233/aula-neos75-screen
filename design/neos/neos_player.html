<!doctype html>
<!-- Néos now playing on the stock "Page 4" background (chrome ring and status bar are the official artwork);
     title, artist and progress beside the ring. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="neos.css">
<style>
.title { position: absolute; left: 140px; width: 316px; top: 132px; font-size: 26px; font-weight: 500; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.artist { position: absolute; left: 140px; width: 316px; top: 170px; font-size: 15px; font-weight: 300; color: #a6a6a6;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style></head><body>
<img class="bg" src="../official/jpg/page4_bg.jpg">
<div class="pill" style="left:140px;top:96px" id="state"></div>
<div class="title" id="title"></div>
<div class="artist" id="artist"></div>
<div class="track" style="left:140px;width:316px;top:222px"><i id="bar"></i><b id="dot"></b></div>
<div class="abs dim" style="left:140px;top:234px;font-size:13px;font-weight:300" id="pos"></div>
<div class="abs dim" style="right:24px;top:234px;font-size:13px;font-weight:300" id="dur"></div>
<script src="../widgets/data.js"></script>
<script>
window.render = () => {
  state.textContent = !DATA.has_media ? "Idle" : DATA.playing ? "Now Playing" : "Paused";
  title.textContent = DATA.has_media ? DATA.title : "Nothing playing";
  artist.textContent = DATA.has_media ? [DATA.artist, DATA.album].filter(Boolean).join("  ·  ") : "";
  const p = DATA.dur ? Math.min(1, DATA.pos / DATA.dur) : 0;
  bar.style.width = `${p * 100}%`; dot.style.left = `${p * 100}%`; dot.style.display = DATA.dur ? "" : "none";
  pos.textContent = mmss(DATA.pos); dur.textContent = DATA.dur ? mmss(DATA.dur) : "--:--";
};
render();
</script>
<script src="status.js"></script></body></html>
