<!doctype html>
<!-- Néos Hi-Fi clock (canvas layout, like stock page 5). The dial follows "CSS Clock (BC17 Braun x Paul
     Smith)" by Paul Noble (https://codepen.io/paulnoble/pen/gbPGMZZ, MIT), as our classic hifi_clock does:
     rim, 60 dashes, 12 numerals, hour/minute hands, accent second hand with tail, centre cap. Redrawn in
     the Néos language: chrome bezel, black face, thin white MiSans numerals, red second hand (the red of the
     stock status dots), date window at 3. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="neos.css"></head>
<body data-status="off">
<img class="strip" src="../official/jpg/page5_bg.jpg">
<svg class="abs" style="left:130px;top:0" width="350" height="360" viewBox="-175 -180 350 360">
  <defs>
    <linearGradient id="bezel" x1="0" y1="-1" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8f9"/><stop offset=".35" stop-color="#9aa0a7"/>
      <stop offset=".55" stop-color="#4b4f55"/><stop offset=".8" stop-color="#c9cdd2"/><stop offset="1" stop-color="#6c7178"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d939a"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa0a6"/>
    </linearGradient>
    <radialGradient id="face" cx="0" cy="-.2" r="1.1">
      <stop offset="0" stop-color="#17181b"/><stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <radialGradient id="cap" cx="-.3" cy="-.3" r="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#b9bec3"/><stop offset="1" stop-color="#6d7176"/>
    </radialGradient>
  </defs>
  <circle r="160" fill="url(#bezel)"/>
  <circle r="153" fill="#0a0a0b"/>
  <circle r="151" fill="url(#face)" stroke="rgba(255,255,255,.08)"/>
  <g id="ticks"></g>
  <g id="nums" font-family="MiSans" font-weight="200" font-size="22" fill="#f2f2f2" text-anchor="middle"></g>
  <text y="-62" text-anchor="middle" font-family="MiSans" font-size="9" letter-spacing="3" fill="#8c8c8c">NÉOS · HI-FI</text>
  <g transform="translate(78,0)">
    <rect x="-17" y="-11" width="34" height="22" rx="4" fill="#131419" stroke="#3a3a3d"/>
    <text id="day" y="5" text-anchor="middle" font-family="MiSans" font-size="13" fill="#ededed"></text>
  </g>
  <g id="h"><rect x="-3.5" y="-78" width="7" height="92" rx="3.5" fill="url(#hand)"/></g>
  <g id="m"><rect x="-2.5" y="-122" width="5" height="138" rx="2.5" fill="url(#hand)"/></g>
  <g id="s"><rect x="-.8" y="-132" width="1.6" height="164" fill="#ff2a2a"/><circle cy="24" r="4" fill="#ff2a2a"/></g>
  <circle r="8" fill="url(#cap)"/><circle r="3" fill="#ff2a2a"/>
</svg>
<script src="../widgets/data.js"></script>
<script>
const NS = "http://www.w3.org/2000/svg";
for (let i = 0; i < 60; i++) {
  const major = i % 5 === 0, l = document.createElementNS(NS, "line"), a = i * 6 * Math.PI / 180;
  const r1 = 146, r2 = major ? 133 : 140;
  l.setAttribute("x1", r1 * Math.sin(a)); l.setAttribute("y1", -r1 * Math.cos(a));
  l.setAttribute("x2", r2 * Math.sin(a)); l.setAttribute("y2", -r2 * Math.cos(a));
  l.setAttribute("stroke", major ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.35)");
  l.setAttribute("stroke-width", major ? 2 : 1);
  ticks.appendChild(l);
}
for (let n = 1; n <= 12; n++) {
  if (n === 3) continue;  // date window
  const a = n * 30 * Math.PI / 180, t = document.createElementNS(NS, "text");
  t.setAttribute("x", 112 * Math.sin(a)); t.setAttribute("y", -112 * Math.cos(a) + 8); t.textContent = n;
  nums.appendChild(t);
}
window.render = () => {
  const [hh, mm, ss] = DATA.hms;
  h.setAttribute("transform", `rotate(${(hh % 12) * 30 + mm / 2})`);
  m.setAttribute("transform", `rotate(${mm * 6 + ss / 10})`);
  s.setAttribute("transform", `rotate(${ss * 6})`);
  day.textContent = DATA.day;
};
render();
</script>
<script src="status.js"></script></body></html>
