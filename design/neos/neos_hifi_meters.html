<!doctype html>
<!-- Néos Hi-Fi meters on the stock "Page 6" background. Structure from our classic hifi_system (after
     "Skeuomorphic boombox" by J Lopes, https://codepen.io/offeringofpie/pen/ogveLjq, MIT): two VU meters
     (scale arc, red zone, needle, pivot) for CPU and GPU, and four fader readouts below. Redrawn in the
     Néos language: hairline white scales on the official dark panel, chrome needles and pivots, MiSans. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="neos.css">
<style>
.vu { position: absolute; top: 102px; width: 212px; height: 140px; }
.fader { position: absolute; top: 252px; width: 96px; }
.fader .lbl { display: block; margin-bottom: 4px; }
.fader > b { display: block; font-size: 17px; font-weight: 300; margin-bottom: 9px; }
.fader .track { position: relative; width: 96px; }
</style></head><body>
<img class="bg" src="../official/jpg/page6_bg.jpg">
<svg class="vu" style="left:22px" id="vu0"></svg>
<svg class="vu" style="left:246px" id="vu1"></svg>
<div class="fader" style="left:24px"><span class="lbl">Memory</span><b id="memv"></b><div class="track"><i id="memb"></i><b id="memd"></b></div></div>
<div class="fader" style="left:134px"><span class="lbl">GPU temp</span><b id="tmpv"></b><div class="track"><i id="tmpb"></i><b id="tmpd"></b></div></div>
<div class="fader" style="left:244px"><span class="lbl">Disk</span><b id="dskv"></b><div class="track"><i id="dskb"></i><b id="dskd"></b></div></div>
<div class="fader" style="left:354px"><span class="lbl">Download</span><b id="netv"></b><div class="track"><i id="netb"></i><b id="netd"></b></div></div>
<script src="../widgets/data.js"></script>
<script>
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const CX = 106, CY = 126, R = 96, A0 = -52, A1 = 52;           // pivot below the visible arc, like a VU meter
const ang = v => A0 + (A1 - A0) * Math.max(0, Math.min(100, v)) / 100;
const pt = (a, r) => [CX + r * Math.sin(a * Math.PI / 180), CY - r * Math.cos(a * Math.PI / 180)];
const arc = (v0, v1, r) => { const [x0, y0] = pt(ang(v0), r), [x1, y1] = pt(ang(v1), r);
  return `M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}`; };
const needles = [];
for (const [i, label] of [[0, "CPU"], [1, "GPU"]]) {
  const svg = document.getElementById("vu" + i);
  svg.setAttribute("viewBox", "0 0 212 140");
  const defs = el("defs", {}, svg), g = el("linearGradient", {id: "n" + i, x1: 0, y1: 1, x2: 0, y2: 0}, defs);
  el("stop", {offset: 0, "stop-color": "#8d939a"}, g); el("stop", {offset: 1, "stop-color": "#ffffff"}, g);
  const cap = el("radialGradient", {id: "c" + i, cx: .35, cy: .3, r: .8}, defs);
  el("stop", {offset: 0, "stop-color": "#fff"}, cap); el("stop", {offset: .6, "stop-color": "#b9bec3"}, cap);
  el("stop", {offset: 1, "stop-color": "#5d6166"}, cap);
  el("path", {d: arc(0, 80, R), fill: "none", stroke: "rgba(255,255,255,.55)", "stroke-width": 1}, svg);
  el("path", {d: arc(80, 100, R), fill: "none", stroke: "#ff2a2a", "stroke-width": 2}, svg);
  for (let v = 0; v <= 100; v += 5) {
    const major = v % 20 === 0, [x0, y0] = pt(ang(v), R), [x1, y1] = pt(ang(v), R + (major ? 9 : 5));
    el("line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: v > 80 ? "#ff2a2a" : "rgba(255,255,255,.75)",
                "stroke-width": major ? 1.4 : 1}, svg);
    if (major) {
      const [tx, ty] = pt(ang(v), R + 19);
      const t = el("text", {x: tx, y: ty + 3, "text-anchor": "middle", "font-family": "MiSans", "font-size": 9,
                            fill: v > 80 ? "#ff6a6a" : "#a6a6a6"}, svg);
      t.textContent = v;
    }
  }
  const name = el("text", {x: 14, y: 132, "font-family": "MiSans", "font-size": 12, fill: "#9a9a9a"}, svg);
  name.textContent = label;
  const val = el("text", {x: 198, y: 132, "text-anchor": "end", "font-family": "MiSans", "font-weight": 200,
                          "font-size": 22, fill: "#f2f2f2"}, svg);
  const needle = el("g", {}, svg);
  // solid stroke: a gradient on a vertical line has a zero-width bounding box and draws nothing
  el("line", {x1: CX, y1: CY, x2: CX, y2: CY - R - 4, stroke: "#f2f4f6", "stroke-width": 1.6, "stroke-linecap": "round"}, needle);
  el("line", {x1: CX, y1: CY, x2: CX, y2: CY - 30, stroke: "#8d939a", "stroke-width": 2.4}, needle);
  el("circle", {cx: CX, cy: CY, r: 9, fill: `url(#c${i})`}, svg);
  needles.push([needle, val]);
}
const fader = (k, pct, text) => {
  document.getElementById(k + "v").textContent = text;
  const v = Math.max(0, Math.min(100, pct));
  document.getElementById(k + "b").style.width = v + "%";
  document.getElementById(k + "d").style.left = v + "%";
};
window.render = () => {
  [DATA.cpu, DATA.gpu].forEach((v, i) => {
    needles[i][0].setAttribute("transform", `rotate(${ang(v)} ${CX} ${CY})`);
    needles[i][1].textContent = `${Math.round(v)}%`;
  });
  fader("mem", DATA.mem, `${DATA.mem} %`);
  fader("tmp", DATA.temp == null ? 0 : DATA.temp, DATA.temp == null ? "—" : `${DATA.temp} °C`);
  fader("dsk", DATA.disk, `${DATA.disk} %`);
  fader("net", Math.min(100, DATA.net * 2), `${DATA.net} MB/s`);   // 50 MB/s full scale
};
render();
</script>
<script src="status.js"></script></body></html>
