<!doctype html>
<!-- Hi-Fi now playing: Webamp (https://github.com/captbaritone/webamp, MIT) with the "Refurbished Hitachi
     Stereo" skin from the Winamp Skin Museum (md5 53d192b798c9294602bf113e7405e403; skin by its original
     author, personal use). The main window fills the top (scaled 1.745x); Winamp's bitmap font has no CJK,
     so below it a display panel in the skin's cream-on-silver style shows title, artist and time with a
     CJK-capable font (ours). Override the skin with ?skin=<md5>. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=block" rel="stylesheet">
<style>
html, body { margin: 0; width: 480px; height: 360px; overflow: hidden; }
body { position: relative; background:
  repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, rgba(0,0,0,.035) 1px 2px),
  linear-gradient(180deg, #d9d9d6 0%, #bdbdb9 100%); }
.panel { position: absolute; left: 10px; right: 10px; top: 212px; bottom: 10px; border-radius: 4px;
  background: linear-gradient(180deg, #f3ecc9, #e6dcae); border: 1px solid #8d8a7b;
  box-shadow: inset 0 2px 5px rgba(60,50,20,.45), 0 1px 0 rgba(255,255,255,.8); padding: 10px 14px;
  font-family: "Noto Sans JP", "Noto Sans SC", sans-serif; color: #2b2a22; }
.title { font-size: 26px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.artist { font-size: 15px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #4a4636; }
.row { position: absolute; left: 14px; right: 14px; bottom: 10px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; }
.track { flex: 1; height: 6px; border-radius: 3px; background: rgba(60,50,20,.18); box-shadow: inset 0 1px 2px rgba(0,0,0,.3); }
.track i { display: block; height: 100%; border-radius: 3px; background: #2b2a22; }
.state { font-size: 11px; letter-spacing: .14em; color: #6b6450; }
#webamp-host { position: absolute; left: 0; top: 0; }
</style></head><body>
<div class="panel"><div class="title" id="title"></div><div class="artist" id="artist"></div>
  <div class="row"><span class="state" id="state"></span><span id="pos"></span><span class="track"><i id="prog"></i></span><span id="dur"></span></div></div>
<script src="data.js"></script>
<script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>
<script>
const skin = Q.get("skin") || "53d192b798c9294602bf113e7405e403";
let shown = null;
const w = new Webamp({initialSkin: {url: `https://r2.webampskins.org/skins/${skin}.wsz`}, initialTracks: []});
const host = document.createElement("div"); host.id = "webamp-host"; document.body.appendChild(host);
const ready = w.renderWhenReady(host).then(() => new Promise(r => setTimeout(r, 1200))).then(() => {
  const root = document.getElementById("webamp");
  for (const sel of ["#playlist-window", "#equalizer-window"]) { const el = root.querySelector(sel); if (el) el.parentElement.style.display = "none"; }
  const main = root.querySelector("#main-window").parentElement;
  main.style.transform = "translate(0px, 0px)"; main.style.left = "0px"; main.style.top = "0px";
  const s = 480 / 275;
  Object.assign(root.style, {position: "absolute", left: "0px", top: "0px", transformOrigin: "0 0", transform: `scale(${s})`});
});
window.render = () => {
  title.textContent = DATA.has_media ? DATA.title : "—";
  artist.textContent = DATA.has_media ? [DATA.artist, DATA.album].filter(Boolean).join(" · ") : "Nothing playing";
  state.textContent = !DATA.has_media ? "STOP" : DATA.playing ? "PLAY" : "PAUSE";
  pos.textContent = mmss(DATA.pos); dur.textContent = DATA.dur ? mmss(DATA.dur) : "--:--";
  prog.style.width = `${DATA.dur ? Math.min(100, DATA.pos / DATA.dur * 100) : 0}%`;
  // Winamp's marquee: ASCII only in the skin font, so give it the artist/title when they are ASCII
  const key = `${DATA.artist}|${DATA.title}`;
  if (key !== shown) {
    shown = key;
    const ascii = /^[\x20-\x7e]*$/.test(DATA.artist + DATA.title);
    ready.then(() => w.setTracksToPlay([{metaData: {artist: ascii ? DATA.artist : "Neos75", title: ascii ? DATA.title : "Now playing"},
      url: "about:blank", duration: DATA.dur || 0}])).then(() => { try { w.stop(); } catch (e) {} });
  }
};
render();
</script></body></html>
